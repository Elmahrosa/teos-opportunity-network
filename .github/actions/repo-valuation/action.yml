name: 'TEOS Repo Valuation'
description: 'Value your GitHub repo as a sellable asset - Score 0-100 + $ estimation'
author: 'Elmahrosa'
branding:
  icon: 'dollar-sign'
  color: 'green'

inputs:
  repo-url:
    description: 'Repo URL (default: current repo)'
    required: false
    default: ${{ github.server_url }}/${{ github.repository }}
  tier:
    description: 'Report tier: basic (free) or gold ($25)'
    required: false
    default: 'basic'
  github-token:
    description: 'GitHub token for API (uses github.token by default)'
    required: false
    default: ${{ github.token }}

outputs:
  score:
    description: 'TEOS Score 0-100'
    value: ${{ steps.valuation.outputs.score }}
  value-low:
    description: 'Low $ valuation'
    value: ${{ steps.valuation.outputs.value-low }}
  value-high:
    description: 'High $ valuation'
    value: ${{ steps.valuation.outputs.value-high }}
  decision:
    description: 'ALERT / LOG / IGNORE'
    value: ${{ steps.valuation.outputs.decision }}

runs:
  using: 'composite'
  steps:
    - id: valuation
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TEOS_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        REPO_URL="${{ inputs.repo-url }}"
        TIER="${{ inputs.tier }}"
        PROJECT="src/Teos.OpportunityNetwork.Runner/Teos.OpportunityNetwork.Runner.csproj"

        echo "=== TEOS Repo Valuation (LIVE) ==="
        echo "Repo: $REPO_URL"
        echo "Tier: $TIER"

        # Temp file for structured result
        RESULT_FILE=$(mktemp)
        trap "rm -f $RESULT_FILE" EXIT

        // Call the real engine - no --smoke flag
        // Runner must support: --repo-url, --tier, --output-json <file>
        // It should write JSON: {"score":88,"value_low":3200,"value_high":7500,"decision":"ALERT"}
        if ! dotnet run --project "$PROJECT" -- --repo-url "$REPO_URL" --tier "$TIER" --output-json "$RESULT_FILE"; then
          echo "::error::TEOS valuation failed"
          cat "$RESULT_FILE" || true
          exit 1
        fi

        echo "--- Raw result ---"
        cat "$RESULT_FILE"

        // Parse JSON without external deps (python is always available on GH runners)
        SCORE=$(python3 -c "import json; print(json.load(open('$RESULT_FILE')).get('score',0))")
        LOW=$(python3 -c "import json; print(json.load(open('$RESULT_FILE')).get('value_low',0))"
        HIGH=$(python3 -c "import json; print(json.load(open('$RESULT_FILE')).get('value_high',0))"
        DECISION=$(python3 -c "import json; print(json.load(open('$RESULT_FILE')).get('decision','IGNORE'))"

        // Export to GITHUB_OUTPUT for composite outputs
        echo "score=$SCORE" >> $GITHUB_OUTPUT
        echo "value-low=$LOW" >> $GITHUB_OUTPUT
        echo "value-high=$HIGH" >> $GITHUB_OUTPUT
        echo "decision=$DECISION" >> $GITHUB_OUTPUT

        echo "### TEOS Valuation Result" >> $GITHUB_STEP_SUMMARY
        echo "- **Score:** $SCORE/100" >> $GITHUB_STEP_SUMMARY
        echo "- **Value:** \$$LOW - \$$HIGH" >> $GITHUB_STEP_SUMMARY
        echo "- **Decision:** $DECISION" >> $GITHUB_STEP_SUMMARY